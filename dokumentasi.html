<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIB 2026 Digital Master Documentation</title>
<link rel="icon" href="logo-fib.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root{--bg:#ffffff;--bg2:#fff5fb;--panel:#ffffff;--glass:#fff3f9;--line:rgba(214,0,143,.16);--pink:#e6007e;--mag:#c4006f;--blue:#0091d5;--pur:#7b2ff7;--fg:#2a2238;--ink:#1a1029;--mut:#6f6782;--gold:#c99400;--silver:#8c93a8;--bronze:#b8703e;--ok:#0f9d63;--f-h:'Nunito','Segoe UI',system-ui,sans-serif;--f-b:'Nunito','Segoe UI',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(70% 40% at 90% -5%,rgba(230,0,126,.10),transparent 60%),radial-gradient(60% 40% at 0% 0%,rgba(0,145,213,.07),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--f-b);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(230,0,126,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(230,0,126,.045) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000 0%,transparent 60%)}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
.w{position:relative;max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);box-shadow:0 2px 18px rgba(230,0,126,.06);border-bottom:1px solid var(--line)}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:31}
nav.top .w{display:flex;align-items:center;gap:12px;padding-block:10px}
nav.top img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 0 2px var(--pink)}
nav.top .brand{font-family:var(--f-h);font-weight:900;font-size:14px;letter-spacing:.06em;line-height:1.25;white-space:nowrap}
nav.top .brand small{display:block;color:var(--mut);font-family:var(--f-b);letter-spacing:.04em;font-size:11px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--mut);font-size:15px;font-weight:800;padding:7px 11px;border-radius:99px}
.tabs a.on{color:#fff;background:linear-gradient(135deg,var(--pink),var(--pur));box-shadow:0 6px 16px rgba(230,0,126,.3)}
.adm-btn{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600}
.adm-btn.on{border-color:var(--ok);color:var(--ok)}
/* layout */
section.pg{display:none;padding-block:28px 60px;animation:fade .35s ease}
section.pg.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.st{font-family:var(--f-h);font-weight:900;font-size:clamp(26px,4.6vw,40px);margin:0 0 6px;letter-spacing:.01em;color:var(--ink);text-wrap:balance}
p.sd{margin:0 0 22px;color:var(--mut)}
.eyebrow{font-family:var(--f-h);font-weight:800;font-size:13px;letter-spacing:.22em;color:var(--blue)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0;box-shadow:0 6px 24px rgba(230,0,126,.06)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,#fff,#fff0f8);box-shadow:0 6px 20px rgba(230,0,126,.07);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .2s,border-color .2s}
.stat:hover{transform:translateY(-3px);border-color:var(--pink)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(230,0,126,.14),transparent 70%)}
.stat b{display:block;font-family:var(--f-h);font-weight:900;font-size:36px;line-height:1.1;color:var(--mag)}
.stat span{font-size:13.5px;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.stat small{display:block;font-size:11.5px;color:var(--mut);margin-top:4px}
h3.ct{margin:0 0 14px;font-size:18px;font-weight:900;font-family:var(--f-h);letter-spacing:.04em;color:var(--mag)}
.muted{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--line)}
.md-Emas{background:linear-gradient(135deg,#ffe58a,#e0a400);color:#2a1d00;border:0}
.md-Perak{background:linear-gradient(135deg,#f6f8ff,#a9b0c6);color:#1d2030;border:0}
.md-Gangsa{background:linear-gradient(135deg,#f6c49a,#b8703e);color:#2a1406;border:0}
.md-Penyertaan{background:var(--glass)}
/* cover */
.cover{position:relative;border-radius:28px;overflow:hidden;border:1px solid rgba(230,0,126,.25);background:linear-gradient(140deg,#ffffff 0%,#fff0f8 55%,#eef8ff 100%);padding:clamp(24px,5vw,56px);min-height:520px;display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center;box-shadow:0 20px 60px rgba(230,0,126,.12)}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 65% at 100% 0%,rgba(230,0,126,.16),transparent 60%),radial-gradient(45% 55% at 0% 100%,rgba(0,145,213,.12),transparent 60%);pointer-events:none}
.cover .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.75;pointer-events:none}
.cover>*{position:relative;min-width:0}
.cv-logo{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.cv-logo img{width:64px;height:64px;border-radius:16px;box-shadow:0 0 0 2px var(--pink),0 0 30px rgba(255,20,147,.6)}
.cv-logo div{font-size:13px;color:var(--mut);line-height:1.35}.cv-logo b{display:block;color:var(--ink);font-size:15px}
.cover h1{margin:0;font-family:var(--f-h);font-weight:900;font-size:clamp(30px,6.2vw,64px);line-height:1.02;letter-spacing:.02em;background:linear-gradient(120deg,#c4006f 0%,#e6007e 45%,#7b2ff7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.cover .dmd{margin-top:14px;font-family:var(--f-h);font-weight:900;font-size:clamp(15px,2.6vw,22px);letter-spacing:.2em;color:var(--blue)}
.cover .sch{margin-top:22px;font-family:var(--f-h);font-weight:900;font-size:clamp(17px,2.6vw,22px);letter-spacing:.1em}
.cover .sch span{display:block;color:var(--pink);font-size:.8em;letter-spacing:.3em;margin-top:4px}
.cv-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.cv-photo{aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:2px solid rgba(255,20,147,.6);box-shadow:0 14px 40px rgba(230,0,126,.22);background:#fff0f8;display:grid;place-items:center;max-width:100%}
.cv-photo img{width:100%;height:100%;object-fit:cover}
.chip3d{position:absolute;font-family:var(--f-h);font-size:10px;letter-spacing:.2em;color:var(--blue);border:1px solid rgba(0,180,255,.5);border-radius:8px;padding:5px 8px;background:rgba(0,180,255,.08)}
/* charts */
.bars{display:grid;gap:8px}
.bar-r{display:grid;grid-template-columns:minmax(90px,190px) 1fr 64px;gap:10px;align-items:center;font-size:15px}
.bar-r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:12px;border-radius:99px;background:#f6e6f0;overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--pur),var(--pink));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar-r b{text-align:right;font-family:var(--f-h);font-weight:900;font-size:14px}
.chart-wrap{overflow-x:auto}
/* tables */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(214,0,143,.08);vertical-align:top}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);background:#fff5fb;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(230,0,126,.04)}
.rk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--f-h);font-size:12px;background:var(--glass);border:1px solid var(--line)}
.rk.r1{background:linear-gradient(135deg,#ffe58a,#e0a400);color:#231800;border:0}.rk.r2{background:linear-gradient(135deg,#f6f8ff,#a9b0c6);color:#151826;border:0}.rk.r3{background:linear-gradient(135deg,#f6c49a,#b8703e);color:#231000;border:0}
/* groups */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select{font:inherit;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0;flex:1 1 180px}
.gc{text-align:left;color:inherit;padding:0;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.gc:hover{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 14px 34px rgba(230,0,126,.15)}
.gc .th{aspect-ratio:16/9;background:linear-gradient(135deg,#ffe0f0,#e3f3ff);position:relative;display:grid;place-items:center;overflow:hidden}
.gc .th img{width:100%;height:100%;object-fit:cover}
.gc .th .k{position:absolute;top:10px;left:10px;font-family:var(--f-h);font-size:11px;font-weight:700;background:#fff;color:var(--mag);border:1px solid var(--pink);padding:5px 9px;border-radius:8px}
.gc .th .m{position:absolute;top:10px;right:10px}
.gc .th .ph{font-family:var(--f-h);font-size:26px;color:rgba(196,0,111,.25)}
.gc .bd{padding:16px}
.gc .nth{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.gc .k2{font-family:var(--f-h);font-weight:900;font-size:13px;color:var(--mag);border:1px solid var(--pink);border-radius:8px;padding:4px 9px}
.gc h4{margin:0;font-size:19px;font-weight:900;line-height:1.3}
.gc p{margin:4px 0 0;font-size:14px;color:var(--mut)}
.gc .sc{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}
.gc .sc b{font-family:var(--f-h);font-size:16px;color:var(--mag)}
/* timeline */
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--pink),var(--pur),var(--blue))}
.tl-i{position:relative;margin-bottom:16px}
.tl-i::before{content:"";position:absolute;left:-25px;top:18px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 0 12px var(--pink)}
.tl-i.und::before{border-color:var(--blue);box-shadow:0 0 12px var(--blue)}
.tl-d{font-family:var(--f-h);font-weight:900;font-size:14px;letter-spacing:.06em;color:var(--pink)}
.tl-i.und .tl-d{color:var(--blue)}
.tl-i h4{margin:2px 0 4px;font-size:19px;font-weight:900}
.tl-i p{margin:0;color:var(--mut);font-size:15.5px}
/* profile */
.prof h4{margin:0 0 6px;font-family:var(--f-h);font-size:12px;letter-spacing:.16em;color:var(--pink)}
.prof .txt{white-space:pre-line}
.empty-f{color:var(--mut);font-style:italic;font-size:13px}
.ajk{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ajk div{background:var(--glass);border-radius:12px;padding:10px 12px;font-size:13px}
.ajk b{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--blue)}
/* awards */
.aw{position:relative;overflow:hidden}
.aw .t{font-family:var(--f-h);font-weight:900;font-size:13px;letter-spacing:.12em;color:var(--blue)}
.aw h4{margin:8px 0 2px;font-size:20px;font-weight:900}
.aw p{margin:0;font-size:15px;color:var(--mut)}
.aw .glow{position:absolute;right:-40px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,20,147,.4),transparent 70%)}
.mlist{display:grid;gap:8px;font-size:15px}
.mlist div{display:flex;gap:8px;align-items:baseline}
.mlist b{font-family:var(--f-h);font-weight:900;font-size:14px;min-width:44px}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
/* galeri besar + motion */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:22px}
.gi{display:block;width:100%;padding:0;border:0;text-align:left;font:inherit;color:inherit;background:#fff;border-radius:22px;overflow:hidden;cursor:zoom-in;box-shadow:0 10px 30px rgba(26,16,41,.10);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.gi:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(230,0,126,.20)}
.gi .im{aspect-ratio:4/3;overflow:hidden;background:#f6eef3;max-width:100%}
.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1);color:transparent;font-size:0}
.gi:hover img{transform:scale(1.08)}
.gi .cp{padding:14px 18px 18px;font-size:16px;font-weight:700;line-height:1.45;color:var(--ink)}
.gi .cp small{display:block;font-size:12.5px;font-weight:900;letter-spacing:.12em;color:var(--pink);margin-bottom:4px;text-transform:uppercase}
.rv{opacity:0;transform:translateY(34px) scale(.96)}
.rv.in{opacity:1;transform:none;transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.sl{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/9;max-height:74vh;width:100%;background:#1a1029;box-shadow:0 24px 60px rgba(26,16,41,.25)}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;color:transparent;font-size:0}
.sl img.on{opacity:1;animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.14) translate(-2%,-2%)}}
.sl .cap{position:absolute;left:0;right:0;bottom:0;padding:70px clamp(16px,4vw,40px) clamp(16px,3vw,30px);background:linear-gradient(transparent,rgba(26,16,41,.88));color:#fff;font-size:clamp(17px,2.4vw,26px);font-weight:900;line-height:1.3}
.sl .cap small{display:block;font-size:13px;letter-spacing:.2em;color:#ff8cc8;margin-bottom:6px}
.sl .nv{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--mag);font-size:26px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sl .nv.p{left:16px}.sl .nv.n{right:16px}
.sl .ct2{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.9);color:var(--mag);font-weight:900;border-radius:99px;padding:6px 14px;font-size:14px}
.lbimg{animation:lbz .45s cubic-bezier(.2,.8,.2,1)}
@keyframes lbz{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* butang 3D analisis */
.b3bar{scroll-margin-top:90px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:6px 0 30px}
.b3d{--c:#ff2d95;--d:#b0005e;position:relative;border:0;border-radius:18px;padding:16px 18px 14px;text-align:left;color:#fff;font:inherit;font-weight:900;font-size:17px;line-height:1.25;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));box-shadow:0 7px 0 var(--d),0 14px 26px rgba(26,16,41,.18);transition:transform .12s,box-shadow .12s;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.b3d i{display:block;font-style:normal;font-size:28px;margin-bottom:6px;text-shadow:none}
.b3d small{display:block;font-size:12.5px;font-weight:700;opacity:.92;margin-top:3px}
.b3d:hover{transform:translateY(-2px);box-shadow:0 9px 0 var(--d),0 18px 30px rgba(26,16,41,.22)}
.b3d:active,.b3d.on{transform:translateY(6px);box-shadow:0 1px 0 var(--d),0 4px 10px rgba(26,16,41,.18)}
.b3d.on::after{content:"";position:absolute;inset:5px;border-radius:14px;border:2.5px solid rgba(255,255,255,.85)}
.anp{animation:lbz .4s ease}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.sl img.on{animation:none}.gi,.gi img,.b3d{transition:none}}
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#f6eef3;border:1px solid var(--line);max-width:100%;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.photo img,.gc .th img{color:transparent;font-size:0}
button.photo{padding:0;width:100%;font:inherit;text-align:left;display:block}
.photo:hover img{transform:scale(1.05)}
.gk{font:inherit;font-size:12.5px}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;font-size:13.5px;font-weight:700;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgba(26,16,41,.85))}
/* admin */
.adm{display:none!important}
body.admin .adm{display:inline-flex!important}
body.admin .adm-b{display:block!important}
.adm-b{display:none!important}
.eb{border:1px dashed var(--pink);background:rgba(230,0,126,.07);color:var(--mag);border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:600;align-items:center;gap:6px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pink),var(--pur));box-shadow:0 8px 24px rgba(230,0,126,.25)}
.btn.g{background:#fff;color:var(--mag);border:1px solid var(--line);box-shadow:none}
.row-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.row-h>div{min-width:0}
.badge-ok{color:var(--ok);border-color:var(--ok)}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(26,16,41,.55);backdrop-filter:blur(6px);overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mbox{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(26,16,41,.3)}
.mbox .x{float:right;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:10px;width:38px;height:38px}
.f label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.f input,.f textarea,.f select{width:100%;font:inherit;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.f textarea{min-height:90px;resize:vertical}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin:12px 0;max-width:100%}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.det dl{display:grid;grid-template-columns:170px 1fr;gap:8px 16px;margin:14px 0;font-size:16px}
.det dt{color:var(--mut);font-size:14px;font-weight:800}
.det dd{margin:0;white-space:pre-line;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15);border:1px solid var(--ok);color:var(--ok);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600}
footer{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.08em;padding-block:20px 40px}
.load{padding:60px 0;text-align:center;color:var(--mut)}
.cmt{border-left:4px solid var(--pink);background:var(--glass);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15.5px;margin-bottom:8px}
.cmt b{font-size:11.5px;color:var(--blue)}

async function load(){
  const r=await (await fetch(GAS_URL+'?action=dok'+(ADMIN?'&kod='+encodeURIComponent(ADMIN):''),{cache:'no-store'})).json();
  if(!r.ok) throw 0;

  if(ADMIN){ try{const p=await (await fetch(GAS_URL+'?action=penjurian&kod='+encodeURIComponent(ADMIN),{cache:'no-store'})).json(); PJ=p.ok?p:null;}catch(_){PJ=null} } else PJ=null;
  compute();
}
const kn=r=>{const n=parseInt(String(r.kod||'').replace(/\D/g,''),10);return isNaN(n)?1000+r.no:n};
const byScore=(a,b)=>(b.avg??-1)-(a.avg??-1)||(b.crit[1]??0)-(a.crit[1]??0)||(b.crit[5]??0)-(a.crit[5]??0)||kn(a)-kn(b);
function quota(){const T=D.tetapan||{};return [Math.max(0,parseInt(T.EMAS,10)||11),Math.max(0,parseInt(T.PERAK,10)||12),Math.max(0,parseInt(T.GANGSA,10)||13)]}
function compute(){
  ROWS=D.groups.map(g=>{
    const s=D.markah.filter(m=>m.no===g.no);
    const j1=s.find(m=>m.slot===1)||null, j2=s.find(m=>m.slot===2)||null, got=[j1,j2].filter(Boolean);
    const avg=got.length?got.reduce((a,m)=>a+m.jumlah,0)/got.length:null;
    const crit=KRITERIA.map((k,i)=>got.length?got.reduce((a,m)=>a+m.k[i],0)/got.length:null);
    const meta=(D.meta||{})[g.no]||{};
    return {...g,j1,j2,n:got.length,avg,crit,meta,kategori:meta.kategori||'',vscore:meta.video,beza:(j1&&j2)?Math.abs(j1.jumlah-j2.jumlah):null,medal:null,rank:null,ext:DOC['k'+g.no]||{}};
  });
  const Q=quota(); const order=ROWS.filter(r=>r.n>0).sort(byScore); let pk=null,pm=null,pr=0;
  order.forEach((r,i)=>{const key=f1(r.avg)+'|'+r.crit[1]+'|'+r.crit[5];let m=i<Q[0]?'Emas':i<Q[0]+Q[1]?'Perak':i<Q[0]+Q[1]+Q[2]?'Gangsa':'Penyertaan';if(key===pk){m=pm;r.rank=pr}else{r.rank=i+1}r.medal=m;pk=key;pm=m;pr=r.rank;});
}
function special(){
  const scored=ROWS.filter(r=>r.n>0);
  const pool=k=>{const t=scored.filter(r=>r.kategori===k);return t.length?t:scored};
  const top=(list,key)=>list.filter(r=>key(r)!=null).sort((a,b)=>key(b)-key(a)||(b.avg-a.avg)||kn(a)-kn(b))[0]||null;
  const vids=ROWS.filter(r=>r.vscore!=null&&r.vscore!=='').sort((x,y)=>+y.vscore-+x.vscore||(y.avg??0)-(x.avg??0));
  const duta=String((D.tetapan||{}).DUTA||'').trim();
  return [
    {t:'Best Digital Innovation',r:top(pool('Digital'),r=>r.crit[3]),b:'Purata tertinggi kriteria Reka bentuk & UX',v:r=>f1(r.crit[3])+'/10'},
    {t:'Best AI-Powered Innovation',r:top(pool('AI'),r=>r.crit[0]),b:'Purata tertinggi kriteria Keaslian & kreativiti',v:r=>f1(r.crit[0])+'/20'},
    {t:'Best Hands-On Learning Innovation',r:top(pool('Fizikal'),r=>r.crit[2]),b:'Purata tertinggi kriteria Fungsi & prototaip',v:r=>f1(r.crit[2])+'/20'},
    {t:'Best Booth Design',r:top(scored,r=>r.crit[4]),b:'Purata tertinggi kriteria Kreativiti booth',v:r=>f1(r.crit[4])+'/10'},
    {t:'Best Pitching Team',r:top(scored,r=>r.crit[5]),b:'Purata tertinggi kriteria Pembentangan',v:r=>f1(r.crit[5])+'/15'},
    {t:'Best Innovation Video',r:vids[0]||null,b:'Markah video tertinggi',v:r=>f1(+r.vscore)+'/100',pend:'Penilaian video selepas tarikh akhir 18 November 2026.'},
    {t:'Best Duta Award',name:duta,b:'Pilihan urus setia',pend:'Ditentukan oleh urus setia.'}
  ].filter(a=>a.r||a.name);
}
function counts(){
  const scored=ROWS.filter(r=>r.n>0), juri=new Set();
  Object.values(D.meta||{}).forEach(m=>{[m.juri1,m.juri2].forEach(j=>{if(j&&j.trim())juri.add(j.trim().toUpperCase())})});
  const sp=special().filter(a=>a.r||a.name).length;
  const med=scored.filter(r=>r.medal&&r.medal!=='Penyertaan').length;
  const custom=(DOC.anugerah||[]).filter(a=>a.penerima).length;
  return {peserta:D.groups.reduce((a,g)=>a+g.ahli.length,0),kumpulan:D.groups.length,projek:scored.length,lengkap:ROWS.filter(r=>r.n===2).length,juri:juri.size,anugerah:med+sp+custom,med,sp,custom,video:D.groups.filter(g=>g.video&&ytId(g.video.yt)).length};
}
function docStatus(){

    ['Profil program',['pengenalan','latar','rasional','matlamat','objektif','impak'].every(k=>String(p[k]||'').trim())],
    ['Kronologi program',!!(DOC.kronologi||DEF_KRON).length],
    ['Komen juri direkod',D.markah.some(m=>String(m.catatan||'').trim())],
    ['Penilaian juri lengkap',ROWS.length&&ROWS.every(r=>r.n===2)],
    ['Keputusan disahkan',!!(DOC.sahkan&&DOC.sahkan.masa)],
    ['Anugerah khas lengkap',special().every(a=>a.r||a.name)],
    ['Gambar & video program',GALERI.length>0],
    ['Video inovasi',ROWS.length&&ROWS.every(r=>r.video&&ytId(r.video.yt))]

  const done=items.filter(i=>i[1]).length;
  return {items,done,pct:Math.round(done/items.length*100),label:DOC.status||(done===items.length?'Lengkap':'Dalam proses')};
}

  ${ROWS.slice().sort((a,b)=>kn(a)-kn(b)).map(r=>`<tr><td>${esc(r.kod)}</td><td><a href="#" data-g="${r.no}" style="color:inherit">${esc(r.produk)}</a></td><td><span class="pill" style="${r.n===2?'color:var(--ok)':''}">${r.n===2?'Selesai':r.n===1?'Sedang Dinilai':'Belum Dinilai'}</span></td>${r.crit.map(v=>`<td class="n">${f1(v)}</td>`).join('')}<td class="n"><b>${f1(r.avg)}</b></td><td class="n">${r.avg!=null?f1(r.avg)+'%':'–'}</td><td style="font-size:12.5px">${[r.j1,r.j2].map((m,i)=>m&&String(m.catatan||'').trim()?`<div style="margin-bottom:4px"><b style="color:var(--blue)">J${i+1}:</b> ${esc(m.catatan)}</div>`:'').join('')||'<span class="muted">–</span>'}</td></tr>`).join('')}</tbody></table></div>
  ${det||`<p class="muted adm-b" style="margin-top:14px">Memuatkan rekod juri…</p><p class="muted" style="margin-top:14px;font-size:13px">Nama juri dan log perubahan markah dipaparkan kepada pentadbir sahaja.</p>`}`;
}

let AN='ringkasan';
function pAnalisis(){
  const sc=ROWS.filter(r=>r.n>0).sort(byScore);
  if(!sc.length) return head('ANALISIS','Analisis & Keputusan','')+'<div class="card muted">Belum ada markah.</div>';
  const av=sc.map(r=>r.avg), mean=av.reduce((a,b)=>a+b,0)/av.length, sd=Math.sqrt(av.reduce((a,b)=>a+(b-mean)**2,0)/av.length);
  const hi=sc[0], lo=sc[sc.length-1];
  const cp=KRITERIA.map((k,i)=>[k.n,sc.reduce((a,r)=>a+r.crit[i],0)/sc.length/k.m*100]);
  const strong=cp.slice().sort((a,b)=>b[1]-a[1]);
  const bz=sc.filter(r=>r.beza!=null), bzAvg=bz.length?bz.reduce((a,r)=>a+r.beza,0)/bz.length:null;
  const W=Math.max(640,sc.length*26), H=220, bw=W/sc.length;
  const svg=`<svg viewBox="0 0 ${W} ${H+64}" width="${W}" height="${H+64}" role="img" aria-label="Carta markah purata setiap kumpulan"><defs><linearGradient id="gb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0091d5"/><stop offset=".55" stop-color="#7b2ff7"/><stop offset="1" stop-color="#e6007e"/></linearGradient></defs>
    ${[0,25,50,75,100].map(v=>`<line x1="0" x2="${W}" y1="${H-v/100*H+10}" y2="${H-v/100*H+10}" stroke="rgba(214,0,143,.12)"/><text x="2" y="${H-v/100*H+6}" fill="#6f6782" font-size="11">${v}</text>`).join('')}
    <line x1="0" x2="${W}" y1="${H-mean/100*H+10}" y2="${H-mean/100*H+10}" stroke="#e0a400" stroke-width="2" stroke-dasharray="6 4"/>
    ${sc.map((r,i)=>`<g><rect x="${i*bw+bw*.16}" y="${H-r.avg/100*H+10}" width="${bw*.68}" height="${r.avg/100*H}" rx="4" fill="url(#gb)"><title>${esc(r.kod)} · ${esc(r.produk)}: ${f1(r.avg)}</title></rect><text transform="translate(${i*bw+bw/2+3},${H+18}) rotate(-55)" fill="#6f6782" font-size="10.5" font-weight="700" text-anchor="end">${esc((r.kod||'').replace(/\s/g,''))}</text></g>`).join('')}</svg>`;
  const subj={};sc.forEach(r=>{(subj[r.subjek]=subj[r.subjek]||[]).push(r)});
  const sub=Object.entries(subj).map(([k,L])=>({k,n:L.length,avg:L.reduce((a,r)=>a+r.avg,0)/L.length,best:L.slice().sort(byScore)[0],emas:L.filter(r=>r.medal==='Emas').length,perak:L.filter(r=>r.medal==='Perak').length,gangsa:L.filter(r=>r.medal==='Gangsa').length})).sort((a,b)=>b.avg-a.avg);
  const md=['Emas','Perak','Gangsa'].map(m=>{const L=sc.filter(r=>r.medal===m);return {m,n:L.length,min:Math.min(...L.map(r=>r.avg)),max:Math.max(...L.map(r=>r.avg))}});
  const B=[['ringkasan','📈','Ringkasan','Statistik utama','#ff2d95','#b0005e'],['carta','📊','Carta Markah','36 kumpulan','#1aa7ff','#0068a8'],['kriteria','🎯','Prestasi Kriteria','Kekuatan & kelemahan','#8b45ff','#5418b8'],['subjek','📚','Mengikut Subjek','Purata & terbaik','#ff9f1a','#c25f00'],['pingat','🏅','Analisis Pingat','Julat markah','#f5b800','#a67c00'],['ranking','🏆','Ranking Penuh','Kedudukan 1–36','#19c37d','#0c8a55']];
  if(PJ) B.push(['komen','💬','Komen Juri','Pentadbir','#ff5a5a','#b32323']);
  if(!B.some(x=>x[0]===AN)) AN='ringkasan';
  const bar=`<div class="b3bar" id="anTop">${B.map(([k,i,t,d,c,dk])=>`<button class="b3d${AN===k?' on':''}" data-an="${k}" style="--c:${c};--d:${dk}"><i>${i}</i>${t}<small>${d}</small></button>`).join('')}</div>`;
  const stats=`<div class="stats">
    <div class="stat"><b>${f1(hi.avg)}</b><span>Markah tertinggi</span><small>${esc(hi.kod)} · ${esc(hi.produk)}</small></div>
    <div class="stat"><b>${f1(lo.avg)}</b><span>Markah terendah</span><small>${esc(lo.kod)} · ${esc(lo.produk)}</small></div>
    <div class="stat"><b>${f1(mean)}</b><span>Purata keseluruhan</span><small>sisihan piawai ${f1(sd)}</small></div>
    <div class="stat"><b>${f1(hi.avg-lo.avg)}</b><span>Julat markah</span><small>tertinggi − terendah</small></div>
    <div class="stat"><b>${f1(bzAvg)}</b><span>Purata beza juri</span><small>${bz.length} booth dinilai 2 juri</small></div>
    <div class="stat"><b>${sc.filter(r=>r.avg>=80).length}</b><span>Markah ≥ 80</span><small>daripada ${sc.length} kumpulan</small></div></div>`;
  const P={
    ringkasan:()=>stats+`<div class="grid g2"><div class="card"><h3 class="ct">RUMUSAN</h3><p style="margin:0 0 10px">Sebanyak <b>${sc.length}</b> projek dinilai oleh dua juri setiap satu. Purata keseluruhan ialah <b>${f1(mean)}</b> markah, dengan <b>${esc(hi.kod)} · ${esc(hi.produk)}</b> mendahului pada <b>${f1(hi.avg)}</b>.</p><p style="margin:0">Kekuatan utama peserta ialah <b>${esc(strong[0][0])}</b> (${f1(strong[0][1])}%), manakala <b>${esc(strong[5][0])}</b> (${f1(strong[5][1])}%) menjadi fokus penambahbaikan siri akan datang.</p></div>
      <div class="card"><h3 class="ct">3 TERATAS</h3><div class="mlist">${sc.slice(0,3).map(r=>`<div><span class="rk r${r.rank}">${r.rank}</span><span style="flex:1;min-width:0"><b style="font-size:16px;min-width:0">${esc(r.produk)}</b><br><span class="muted">${esc(r.kod)} · ${esc(r.subjek)}</span></span><b style="color:var(--mag);font-size:20px">${f1(r.avg)}</b></div>`).join('')}</div></div></div>`,
    carta:()=>`<div class="card"><h3 class="ct">CARTA MARKAH PURATA SETIAP KUMPULAN</h3><p class="muted" style="margin:-6px 0 10px;font-size:14px">Garis kuning putus-putus = purata keseluruhan (${f1(mean)}).</p><div class="chart-wrap">${svg}</div></div>`,
    kriteria:()=>`<div class="grid g2"><div class="card"><h3 class="ct">PRESTASI MENGIKUT KRITERIA (% DARIPADA MAKSIMUM)</h3>${bars(cp.map(([l,v])=>[l,v,f1(v)+'%']),100)}</div>
      <div class="card"><h3 class="ct">ANALISIS KEKUATAN PROJEK</h3><p style="margin:0 0 8px">Kekuatan utama keseluruhan ialah <b>${esc(strong[0][0])}</b> (${f1(strong[0][1])}%), diikuti <b>${esc(strong[1][0])}</b> (${f1(strong[1][1])}%).</p><p style="margin:0">Ruang penambahbaikan terbesar ialah <b>${esc(strong[5][0])}</b> (${f1(strong[5][1])}%). Peratus dikira daripada purata markah semua projek yang dinilai.</p>
      <h3 class="ct" style="margin-top:18px">PERATURAN PEMECAH SERI</h3><p style="margin:0;font-size:15px">Seperti diluluskan urus setia: (1) purata markah keseluruhan, (2) markah Impak inovasi, (3) markah Pembentangan. Jika ketiga-tiga sama, kumpulan berkongsi kedudukan dan pingat yang sama.</p></div></div>`,
    subjek:()=>`<div class="grid g2"><div class="card"><h3 class="ct">PURATA MARKAH MENGIKUT SUBJEK</h3>${bars(sub.map(x=>[x.k,x.avg,f1(x.avg)]),100)}</div>
      <div class="card"><h3 class="ct">KUMPULAN TERBAIK SETIAP SUBJEK</h3><div class="mlist">${sub.map(x=>`<div><span style="flex:1;min-width:0"><b style="font-size:15px;min-width:0">${esc(x.k)}</b><br><span class="muted">${esc(x.best.kod)} · ${esc(x.best.produk)}</span></span><b style="color:var(--mag)">${f1(x.best.avg)}</b></div>`).join('')}</div></div></div>
      <div class="tbl-wrap" style="margin-top:16px"><table><thead><tr><th>Subjek</th><th class="n">Kumpulan</th><th class="n">Purata</th><th class="n">Emas</th><th class="n">Perak</th><th class="n">Gangsa</th></tr></thead><tbody>${sub.map(x=>`<tr><td>${esc(x.k)}</td><td class="n">${x.n}</td><td class="n"><b>${f1(x.avg)}</b></td><td class="n">${x.emas}</td><td class="n">${x.perak}</td><td class="n">${x.gangsa}</td></tr>`).join('')}</tbody></table></div>`,
    pingat:()=>`<div class="grid g3">${md.map(x=>`<div class="card"><h3 class="ct">${medalPill(x.m)} &nbsp;${x.n} KUMPULAN</h3><p style="margin:0;font-size:17px">Julat markah <b>${f1(x.min)} – ${f1(x.max)}</b></p></div>`).join('')}</div>
      <div class="card" style="margin-top:16px"><h3 class="ct">TABURAN PINGAT</h3>${bars(md.map(x=>[x.m,x.n,x.n]),Math.max(...md.map(x=>x.n)))}<p class="muted" style="margin:12px 0 0;font-size:14px">Pingat diberi mengikut kedudukan: ${quota()[0]} Emas, ${quota()[1]} Perak, ${quota()[2]} Gangsa.</p></div>`,
    ranking:()=>`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Kod</th><th>Projek</th><th>Subjek</th><th class="n">Juri 1</th><th class="n">Juri 2</th><th class="n">Purata</th><th class="n">Beza</th><th>Pingat</th></tr></thead><tbody>
      ${sc.map(r=>`<tr><td><span class="rk ${r.rank<=3?'r'+r.rank:''}">${r.rank}</span></td><td>${esc(r.kod)}</td><td><a href="#" data-g="${r.no}" style="color:inherit;font-weight:700">${esc(r.produk)}</a></td><td>${esc(r.subjek)}</td><td class="n">${r.j1?f1(r.j1.jumlah):''}</td><td class="n">${r.j2?f1(r.j2.jumlah):''}</td><td class="n"><b>${f1(r.avg)}</b></td><td class="n">${r.beza!=null?f1(r.beza):''}</td><td>${medalPill(r.medal)}</td></tr>`).join('')}</tbody></table></div>`,
    komen:()=>commentAnalysis()
  };
  return head('ANALISIS & KEPUTUSAN','Analisis Pertandingan','Tekan butang untuk melihat setiap analisis. Ranking berdasarkan purata markah dua juri.')+bar+`<div class="anp">${P[AN]()}</div>`;
}
function commentAnalysis(){
  const c=PJ.markah.filter(m=>String(m.catatan||'').trim());

  const sb=e.target.closest('[data-sl]'); if(sb){slShow(+sb.dataset.sl);clearInterval(SL.t);SL.t=setInterval(()=>{if($('ov').hidden&&!document.hidden)slShow(1)},5500);return}
  const sli=e.target.closest('#sl img.on'); if(sli){lightbox(sli.dataset.id);return}
  const an=e.target.closest('[data-an]'); if(an){AN=an.dataset.an;render();document.getElementById('anTop').scrollIntoView({behavior:'smooth',block:'start'});return}
  const g=e.target.closest('[data-g]'); if(g){e.preventDefault();groupDetail(+g.dataset.g);return}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, i=+a.dataset.i;
  if(act==='print'){buildReport();setTimeout(()=>print(),300);return}
  if(!ADMIN) return;
  if(act==='profil'){const p={...DEF_PROFIL,...(DOC.profil||{})};form('Sunting profil program',[['nama','Nama program'],['tarikh','Tarikh'],['lokasi','Lokasi'],['penganjur','Penganjur'],['bidang','Bidang inovasi'],['tema','Tema program'],['sasaran','Sasaran peserta'],['pengenalan','Pengenalan','t'],['latar','Latar belakang','t'],['rasional','Rasional pelaksanaan','t'],['matlamat','Matlamat','t'],['objektif','Objektif','t'],['impak','Impak yang diharapkan','t'],['ajk','Jawatankuasa (satu baris: Jawatan | Nama)','t']],p,o=>save('profil',o))}
  if(act==='cover'){form('Gambar utama cover',[['gambar','Pautan gambar Google Drive'],['kapsyen','Kapsyen']],DOC.cover||{},o=>save('cover',o))}
  if(act==='kron'){const L=(DOC.kronologi||DEF_KRON).slice();const x=i>=0?L[i]:{kat:KAT_KRON[0]};
    form(i>=0?'Sunting aktiviti':'Tambah aktiviti',[['tarikh','Tarikh (biarkan kosong jika belum disahkan)','d'],['masa','Masa'],['tajuk','Aktiviti'],['ket','Keterangan','t'],['kat','Kategori','s',KAT_KRON]],x,o=>{if(!o.tajuk)throw new Error('Isi nama aktiviti');if(i>=0)L[i]=o;else L.push(o);return save('kronologi',L)},i>=0?`<button class="btn g" type="button" id="del">🗑 Padam</button>`:'');
    if(i>=0)$('del').onclick=async()=>{if($('del').dataset.c){L.splice(i,1);await save('kronologi',L);closeM()}else{$('del').dataset.c=1;$('del').textContent='Tekan lagi untuk padam'}}}
  if(act==='kedit'){const no=+a.dataset.no;closeM();form('Butiran kumpulan '+(ROWS.find(r=>r.no===no)||{}).kod,KFIELDS,DOC['k'+no]||{},o=>save('k'+no,o))}
  if(act==='aw'){const L=(DOC.anugerah||[]).slice();const x=i>=0?L[i]:{};
    form(i>=0?'Sunting anugerah':'Tambah kategori anugerah',[['jenis','Jenis (cth. Anugerah Utama)'],['nama','Nama anugerah'],['penerima','Penerima (kod/kumpulan/individu)'],['catatan','Catatan']],x,o=>{if(!o.nama)throw new Error('Isi nama anugerah');if(i>=0)L[i]=o;else L.push(o);return save('anugerah',L)},i>=0?`<button class="btn g" type="button" id="del">🗑 Padam</button>`:'');
    if(i>=0)$('del').onclick=async()=>{if($('del').dataset.c){L.splice(i,1);await save('anugerah',L);closeM()}else{$('del').dataset.c=1;$('del').textContent='Tekan lagi untuk padam'}}}
  if(act==='foto'){const L=(DOC.gambar||[]).slice();const x=i>=0?L[i]:{};
    form(i>=0?'Sunting gambar':'Tambah gambar',[['url','Pautan gambar Google Drive'],['cap','Kapsyen']],x,o=>{if(!/^https:\/\//.test(o.url))throw new Error('Pautan tidak sah');if(i>=0)L[i]=o;else L.push(o);return save('gambar',L)},i>=0?`<button class="btn g" type="button" id="del">🗑 Padam</button>`:'');
    if(i>=0)$('del').onclick=async()=>{if($('del').dataset.c){L.splice(i,1);await save('gambar',L.length?L:null);closeM()}else{$('del').dataset.c=1;$('del').textContent='Tekan lagi untuk padam'}}}
  if(act==='status'){form('Label status dokumentasi',[['status','Status','s',['Dalam proses','Menunggu pengesahan','Lengkap']]],{status:DOC.status||'Dalam proses'},o=>save('status',o.status))}
  if(act==='sahkan'){const on=!(DOC.sahkan&&DOC.sahkan.masa);if(a.dataset.c){a.disabled=true;try{await save('sahkan',on?{masa:new Date().toISOString()}:null)}catch(err){toast('Gagal: '+err.message,1)}}else{a.dataset.c=1;a.textContent=on?'Tekan lagi untuk sahkan':'Tekan lagi untuk batal'}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){FIL.q=e.target.value;const p=e.target.selectionStart;render();const f=$('fq');f.focus();f.setSelectionRange(p,p)}
});
document.addEventListener('change',e=>{if(e.target.id==='fs'){FIL.s=e.target.value;render()}if(e.target.id==='fm2'){FIL.m=e.target.value;render()}});

$('admBtn').onclick=()=>{
  if(ADMIN){ADMIN='';ss('fibAdm',null);PJ=null;load().then(render);toast('Keluar mod pentadbir');return}
  modal(`<h2 class="st" style="font-size:20px">Mod Pentadbir</h2><p class="muted">Masukkan kod urus setia untuk menyunting dokumentasi dan melihat markah individu juri.</p><form class="f" id="lg"><label for="lk">Kod pentadbir</label><input id="lk" type="password" autocomplete="off"><div style="margin-top:14px"><button class="btn" type="submit">Masuk</button></div><div id="lm" class="muted" style="margin-top:8px"></div></form>`);
  $('lk').focus();
  $('lg').onsubmit=async e=>{e.preventDefault();const k=$('lk').value.trim().toUpperCase();$('lm').textContent='Menyemak…';ADMIN=k;try{await load();if(!ADMIN){$('lm').textContent='Kod salah.';return}ss('fibAdm',k);closeM();render();toast('Mod pentadbir aktif')}catch(_){ADMIN='';$('lm').textContent='Tiada sambungan.'}};
};
function route(){if(!$('ov').hidden)closeM();const h=location.hash.slice(1);PAGE=h==='kronologi'?'tentatif':['utama','cover','profil','tentatif','galeri','kumpulan','penilaian','analisis','anugerah','laporan'].includes(h)?h:'utama';if(D){render();scrollTo(0,0)}}
addEventListener('hashchange',route);
route();
load().then(render).catch(()=>{$('main').innerHTML='<div class="load">Gagal memuatkan data. <button class="btn g" onclick="location.reload()">Cuba lagi</button></div>'});
</script>
