<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIB 2026 Digital Master Documentation</title>
<link rel="icon" href="logo-fib.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#060819;--bg2:#0d1033;--panel:rgba(20,22,60,.55);--glass:rgba(255,255,255,.055);--line:rgba(140,120,255,.22);--pink:#ff1493;--mag:#d6008f;--blue:#00b4ff;--pur:#7b2ff7;--fg:#f3f1ff;--mut:#a9a6d6;--gold:#ffcf4a;--silver:#d8dcec;--bronze:#e7a46f;--ok:#3ee6a0;--f-h:'Orbitron',system-ui,sans-serif;--f-b:'Poppins',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(90% 60% at 85% -10%,rgba(255,20,147,.28),transparent 60%),radial-gradient(70% 50% at 0% 10%,rgba(0,180,255,.18),transparent 60%),radial-gradient(80% 60% at 50% 110%,rgba(123,47,247,.25),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--f-b);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,180,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,255,.06) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000 0%,transparent 60%)}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
.w{position:relative;max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(6,8,25,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(6,8,25,.95);z-index:31}
nav.top .w{display:flex;align-items:center;gap:12px;padding-block:10px}
nav.top img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 0 2px var(--pink)}
nav.top .brand{font-family:var(--f-h);font-size:12px;letter-spacing:.12em;line-height:1.25;white-space:nowrap}
nav.top .brand small{display:block;color:var(--mut);font-family:var(--f-b);letter-spacing:.04em;font-size:11px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--mut);font-size:13px;font-weight:600;padding:7px 11px;border-radius:99px}
.tabs a.on{color:#fff;background:linear-gradient(135deg,var(--pink),var(--pur));box-shadow:0 0 16px rgba(255,20,147,.45)}
.adm-btn{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600}
.adm-btn.on{border-color:var(--ok);color:var(--ok)}
/* layout */
section.pg{display:none;padding-block:28px 60px;animation:fade .35s ease}
section.pg.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.st{font-family:var(--f-h);font-size:clamp(20px,4vw,30px);margin:0 0 4px;letter-spacing:.04em;text-wrap:balance}
p.sd{margin:0 0 22px;color:var(--mut)}
.eyebrow{font-family:var(--f-h);font-size:11px;letter-spacing:.3em;color:var(--blue)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(10px);min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .2s,border-color .2s}
.stat:hover{transform:translateY(-3px);border-color:var(--pink)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,20,147,.35),transparent 70%)}
.stat b{display:block;font-family:var(--f-h);font-size:30px;line-height:1.1}
.stat span{font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.stat small{display:block;font-size:11.5px;color:var(--mut);margin-top:4px}
h3.ct{margin:0 0 12px;font-size:15px;font-family:var(--f-h);letter-spacing:.08em;color:#fff}
.muted{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--line)}
.md-Emas{background:linear-gradient(135deg,#ffe58a,#e0a400);color:#2a1d00;border:0}
.md-Perak{background:linear-gradient(135deg,#f6f8ff,#a9b0c6);color:#1d2030;border:0}
.md-Gangsa{background:linear-gradient(135deg,#f6c49a,#b8703e);color:#2a1406;border:0}
.md-Penyertaan{background:var(--glass)}
/* cover */
.cover{position:relative;border-radius:28px;overflow:hidden;border:1px solid rgba(255,20,147,.4);background:linear-gradient(140deg,#1a0430 0%,#0a0f3a 55%,#04112e 100%);padding:clamp(24px,5vw,56px);min-height:520px;display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center;box-shadow:0 0 80px rgba(255,20,147,.2)}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 100% 0%,rgba(255,20,147,.45),transparent 60%),radial-gradient(50% 60% at 0% 100%,rgba(0,180,255,.35),transparent 60%);pointer-events:none}
.cover .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.75;pointer-events:none}
.cover>*{position:relative;min-width:0}
.cv-logo{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.cv-logo img{width:64px;height:64px;border-radius:16px;box-shadow:0 0 0 2px var(--pink),0 0 30px rgba(255,20,147,.6)}
.cv-logo div{font-size:13px;color:var(--mut);line-height:1.35}.cv-logo b{display:block;color:#fff;font-size:15px}
.cover h1{margin:0;font-family:var(--f-h);font-weight:900;font-size:clamp(30px,6.2vw,64px);line-height:1.02;letter-spacing:.02em;background:linear-gradient(180deg,#fff 0%,#ffc4e6 45%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,20,147,.5));text-wrap:balance}
.cover .dmd{margin-top:14px;font-family:var(--f-h);font-size:clamp(13px,2.4vw,20px);letter-spacing:.32em;color:var(--blue)}
.cover .sch{margin-top:22px;font-family:var(--f-h);font-size:clamp(14px,2.4vw,19px);letter-spacing:.14em}
.cover .sch span{display:block;color:var(--pink);font-size:.8em;letter-spacing:.3em;margin-top:4px}
.cv-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.cv-photo{aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:2px solid rgba(255,20,147,.6);box-shadow:0 0 40px rgba(255,20,147,.4);background:#0b0d2a;display:grid;place-items:center;max-width:100%}
.cv-photo img{width:100%;height:100%;object-fit:cover}
.chip3d{position:absolute;font-family:var(--f-h);font-size:10px;letter-spacing:.2em;color:var(--blue);border:1px solid rgba(0,180,255,.5);border-radius:8px;padding:5px 8px;background:rgba(0,180,255,.08)}
/* charts */
.bars{display:grid;gap:8px}
.bar-r{display:grid;grid-template-columns:minmax(80px,150px) 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar-r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:12px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--pur),var(--pink));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar-r b{text-align:right;font-family:var(--f-h);font-size:12px}
.chart-wrap{overflow-x:auto}
/* tables */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(140,120,255,.12);vertical-align:top}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);background:rgba(255,255,255,.03);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(255,20,147,.05)}
.rk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--f-h);font-size:12px;background:var(--glass);border:1px solid var(--line)}
.rk.r1{background:linear-gradient(135deg,#ffe58a,#e0a400);color:#231800;border:0}.rk.r2{background:linear-gradient(135deg,#f6f8ff,#a9b0c6);color:#151826;border:0}.rk.r3{background:linear-gradient(135deg,#f6c49a,#b8703e);color:#231000;border:0}
/* groups */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select{font:inherit;color:var(--fg);background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0;flex:1 1 180px}
.gc{text-align:left;color:inherit;padding:0;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.gc:hover{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 14px 34px rgba(255,20,147,.25)}
.gc .th{aspect-ratio:16/9;background:linear-gradient(135deg,#25064a,#062a52);position:relative;display:grid;place-items:center;overflow:hidden}
.gc .th img{width:100%;height:100%;object-fit:cover}
.gc .th .k{position:absolute;top:10px;left:10px;font-family:var(--f-h);font-size:11px;font-weight:700;background:rgba(6,8,25,.85);border:1px solid var(--pink);padding:5px 9px;border-radius:8px}
.gc .th .m{position:absolute;top:10px;right:10px}
.gc .th .ph{font-family:var(--f-h);font-size:26px;color:rgba(255,255,255,.18)}
.gc .bd{padding:14px}
.gc h4{margin:0;font-size:16px;line-height:1.3}
.gc p{margin:4px 0 0;font-size:12.5px;color:var(--mut)}
.gc .sc{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}
.gc .sc b{font-family:var(--f-h);font-size:16px;color:#fff}
/* timeline */
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--pink),var(--pur),var(--blue))}
.tl-i{position:relative;margin-bottom:16px}
.tl-i::before{content:"";position:absolute;left:-25px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--pink);box-shadow:0 0 12px var(--pink)}
.tl-i.und::before{border-color:var(--blue);box-shadow:0 0 12px var(--blue)}
.tl-d{font-family:var(--f-h);font-size:12px;letter-spacing:.12em;color:var(--pink)}
.tl-i.und .tl-d{color:var(--blue)}
.tl-i h4{margin:2px 0 4px;font-size:16px}
.tl-i p{margin:0;color:var(--mut);font-size:13.5px}
/* profile */
.prof h4{margin:0 0 6px;font-family:var(--f-h);font-size:12px;letter-spacing:.16em;color:var(--pink)}
.prof .txt{white-space:pre-line}
.empty-f{color:var(--mut);font-style:italic;font-size:13px}
.ajk{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ajk div{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;font-size:13px}
.ajk b{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--blue)}
/* awards */
.aw{position:relative;overflow:hidden}
.aw .t{font-family:var(--f-h);font-size:12px;letter-spacing:.12em;color:var(--blue)}
.aw h4{margin:8px 0 2px;font-size:17px}
.aw p{margin:0;font-size:13px;color:var(--mut)}
.aw .glow{position:absolute;right:-40px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,20,147,.4),transparent 70%)}
.mlist{display:grid;gap:6px;font-size:13px}
.mlist div{display:flex;gap:8px;align-items:baseline}
.mlist b{font-family:var(--f-h);font-size:11px;min-width:64px}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#0b0d2a;border:1px solid var(--line);max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
/* admin */
.adm{display:none!important}
body.admin .adm{display:inline-flex!important}
body.admin .adm-b{display:block!important}
.adm-b{display:none!important}
.eb{border:1px dashed var(--pink);background:rgba(255,20,147,.1);color:#fff;border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:600;align-items:center;gap:6px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pink),var(--pur));box-shadow:0 8px 24px rgba(255,20,147,.35)}
.btn.g{background:var(--glass);border:1px solid var(--line);box-shadow:none}
.row-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.row-h>div{min-width:0}
.badge-ok{color:var(--ok);border-color:var(--ok)}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,4,14,.8);backdrop-filter:blur(6px);overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mbox{max-width:860px;margin:0 auto;background:linear-gradient(180deg,#141749,#0a0c2a);border:1px solid var(--pink);border-radius:22px;padding:22px;box-shadow:0 0 60px rgba(255,20,147,.3)}
.mbox .x{float:right;border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:10px;width:38px;height:38px}
.f label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.f input,.f textarea,.f select{width:100%;font:inherit;color:var(--fg);background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.f textarea{min-height:90px;resize:vertical}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin:12px 0;max-width:100%}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.det dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:12px 0;font-size:14px}
.det dt{color:var(--mut);font-size:12.5px}
.det dd{margin:0;white-space:pre-line;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#14183f;border:1px solid var(--ok);color:var(--ok);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600}
footer{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.08em;padding-block:20px 40px}
.load{padding:60px 0;text-align:center;color:var(--mut)}
.cmt{border-left:3px solid var(--pink);background:rgba(0,0,0,.25);border-radius:0 10px 10px 0;padding:8px 12px;font-size:13px;margin-bottom:8px}
.cmt b{font-size:11.5px;color:var(--blue)}
@media (max-width:820px){.cover{grid-template-columns:1fr}.cv-photo{max-width:300px;margin:0 auto}.det dl{grid-template-columns:1fr}.det dt{margin-top:6px}nav.top .brand{display:none}}
/* print report */
#report{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm 12mm}
  html,body{background:#fff!important;color:#111!important}
  body::before,body::after,nav.top,section.pg,footer,.ov,.toast{display:none!important}
  #report{display:block;font-family:var(--f-b);font-size:10.5pt;color:#111}
  #report .pgb{page-break-after:always}
  #report h1,#report h2{font-family:var(--f-h);color:#b0006a}
  #report table{min-width:0;font-size:9pt}
  #report th,#report td{border:1px solid #ddd;padding:4px 6px;color:#111;background:#fff}
  #report th{color:#555}
  #report .rcover{height:265mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(140deg,#1a0430,#0a0f3a 55%,#04112e)!important;color:#fff;border-radius:6mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report .rcover h1{color:#fff;font-size:30pt;margin:10mm 0 2mm}
  #report .rcover img{width:42mm;height:42mm;border-radius:6mm}
}
</style>
</head>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxOr96JYjq4h_O0QIif97x35_FL_x3nt4LtdYPbC20uqe_yXn-J3_3VuF9dO32hfH6ATA/exec';
const KRITERIA=[
  {n:'Keaslian & kreativiti idea',m:20},{n:'Impak inovasi',m:25},{n:'Fungsi, keberkesanan & kualiti prototaip',m:20},
  {n:'Reka bentuk & pengalaman pengguna',m:10},{n:'Kreativiti booth pameran',m:10},{n:'Pembentangan, demonstrasi & soal jawab',m:15}];
/* Kandungan asal daripada buku program rasmi FIB 2.0. Medan kosong diisi pentadbir. */
const DEF_PROFIL={
  nama:'Future Innovators Bootcamp 2026 (FIB 2.0)',
  tarikh:'12 November 2026', lokasi:'Dewan Sri Gemilang, SM Sains Pasir Puteh',
  penganjur:'Kelab Inovasi SM Sains Pasir Puteh', bidang:'Learning Innovation',
  tema:'Innovative learning, inspire the future',
  sasaran:'Murid Tingkatan 1, 2 dan 3 SM Sains Pasir Puteh',
  pengenalan:'Future Innovators Bootcamp 2.0 anjuran Kelab Inovasi SM Sains Pasir Puteh merupakan program pembangunan inovasi murid berfokuskan Learning Innovation melalui teknologi digital dan pendekatan Project-Based Learning. Program ini melibatkan murid Tingkatan 1, 2 dan 3 untuk menghasilkan produk inovasi dengan bimbingan DUTA FIB. Murid turut didedahkan kepada penggunaan AI, pembangunan kandungan digital, penghasilan video, reka bentuk booth dan pembentangan produk melalui Showcase Future Innovators SMSPP.',
  latar:'', rasional:'', matlamat:'',

async function load(){
  const r=await (await fetch(GAS_URL+'?action=dok'+(ADMIN?'&kod='+encodeURIComponent(ADMIN):''),{cache:'no-store'})).json();
  if(!r.ok) throw 0;
  D=r; DOC=r.doc||{};
  if(ADMIN&&!r.admin){ADMIN='';ss('fibAdm',null)}
  if(ADMIN){ try{const p=await (await fetch(GAS_URL+'?action=penjurian&kod='+encodeURIComponent(ADMIN),{cache:'no-store'})).json(); PJ=p.ok?p:null;}catch(_){PJ=null} } else PJ=null;
  compute();
}
const kn=r=>{const n=parseInt(String(r.kod||'').replace(/\D/g,''),10);return isNaN(n)?1000+r.no:n};
const byScore=(a,b)=>(b.avg??-1)-(a.avg??-1)||(b.crit[1]??0)-(a.crit[1]??0)||(b.crit[5]??0)-(a.crit[5]??0)||kn(a)-kn(b);
function quota(){const T=D.tetapan||{};return [Math.max(0,parseInt(T.EMAS,10)||11),Math.max(0,parseInt(T.PERAK,10)||12),Math.max(0,parseInt(T.GANGSA,10)||13)]}
function compute(){
  ROWS=D.groups.map(g=>{
    const s=D.markah.filter(m=>m.no===g.no);
    const j1=s.find(m=>m.slot===1)||null, j2=s.find(m=>m.slot===2)||null, got=[j1,j2].filter(Boolean);
    const avg=got.length?got.reduce((a,m)=>a+m.jumlah,0)/got.length:null;
    const crit=KRITERIA.map((k,i)=>got.length?got.reduce((a,m)=>a+m.k[i],0)/got.length:null);
    const meta=(D.meta||{})[g.no]||{};
    return {...g,j1,j2,n:got.length,avg,crit,meta,kategori:meta.kategori||'',vscore:meta.video,beza:(j1&&j2)?Math.abs(j1.jumlah-j2.jumlah):null,medal:null,rank:null,ext:DOC['k'+g.no]||{}};
  });
  const Q=quota(); const order=ROWS.filter(r=>r.n>0).sort(byScore); let pk=null,pm=null,pr=0;
  order.forEach((r,i)=>{const key=f1(r.avg)+'|'+r.crit[1]+'|'+r.crit[5];let m=i<Q[0]?'Emas':i<Q[0]+Q[1]?'Perak':i<Q[0]+Q[1]+Q[2]?'Gangsa':'Penyertaan';if(key===pk){m=pm;r.rank=pr}else{r.rank=i+1}r.medal=m;pk=key;pm=m;pr=r.rank;});
}
function special(){
  const scored=ROWS.filter(r=>r.n>0);
  const pool=k=>{const t=scored.filter(r=>r.kategori===k);return t.length?t:scored};
  const top=(list,key)=>list.filter(r=>key(r)!=null).sort((a,b)=>key(b)-key(a)||(b.avg-a.avg)||kn(a)-kn(b))[0]||null;
  const vids=ROWS.filter(r=>r.vscore!=null&&r.vscore!=='').sort((x,y)=>+y.vscore-+x.vscore||(y.avg??0)-(x.avg??0));
  const duta=String((D.tetapan||{}).DUTA||'').trim();
  return [
    {t:'Best Digital Innovation',r:top(pool('Digital'),r=>r.crit[3]),b:'Purata tertinggi kriteria Reka bentuk & UX',v:r=>f1(r.crit[3])+'/10'},
    {t:'Best AI-Powered Innovation',r:top(pool('AI'),r=>r.crit[0]),b:'Purata tertinggi kriteria Keaslian & kreativiti',v:r=>f1(r.crit[0])+'/20'},
    {t:'Best Hands-On Learning Innovation',r:top(pool('Fizikal'),r=>r.crit[2]),b:'Purata tertinggi kriteria Fungsi & prototaip',v:r=>f1(r.crit[2])+'/20'},
    {t:'Best Booth Design',r:top(scored,r=>r.crit[4]),b:'Purata tertinggi kriteria Kreativiti booth',v:r=>f1(r.crit[4])+'/10'},
    {t:'Best Pitching Team',r:top(scored,r=>r.crit[5]),b:'Purata tertinggi kriteria Pembentangan',v:r=>f1(r.crit[5])+'/15'},
    {t:'Best Innovation Video',r:vids[0]||null,b:'Markah video tertinggi',v:r=>f1(+r.vscore)+'/100',pend:'Penilaian video selepas tarikh akhir 18 November 2026.'},
    {t:'Best Duta Award',name:duta,b:'Pilihan urus setia',pend:'Ditentukan oleh urus setia.'}
  ];
}
function counts(){
  const scored=ROWS.filter(r=>r.n>0), juri=new Set();
  Object.values(D.meta||{}).forEach(m=>{[m.juri1,m.juri2].forEach(j=>{if(j&&j.trim())juri.add(j.trim().toUpperCase())})});
  const sp=special().filter(a=>a.r||a.name).length;
  const med=scored.filter(r=>r.medal&&r.medal!=='Penyertaan').length;
  const custom=(DOC.anugerah||[]).filter(a=>a.penerima).length;
  return {peserta:D.groups.reduce((a,g)=>a+g.ahli.length,0),kumpulan:D.groups.length,projek:scored.length,lengkap:ROWS.filter(r=>r.n===2).length,juri:juri.size,anugerah:med+sp+custom,med,sp,custom,video:D.groups.filter(g=>g.video&&ytId(g.video.yt)).length};
}
function docStatus(){
  const p={...DEF_PROFIL,...(DOC.profil||{})};
  const items=[
    ['Profil program',['pengenalan','latar','rasional','matlamat','objektif','impak'].every(k=>String(p[k]||'').trim())],
    ['Kronologi program',!!(DOC.kronologi||DEF_KRON).length],
    ['Butiran kumpulan',ROWS.length&&ROWS.every(r=>r.ext&&r.ext.sinopsis)],
    ['Penilaian juri lengkap',ROWS.length&&ROWS.every(r=>r.n===2)],
    ['Keputusan disahkan',!!(DOC.sahkan&&DOC.sahkan.masa)],
    ['Anugerah khas lengkap',special().every(a=>a.r||a.name)],
    ['Gambar program',!!(DOC.gambar||[]).length],
    ['Video inovasi',ROWS.length&&ROWS.every(r=>r.video&&ytId(r.video.yt))]
  ];
  const done=items.filter(i=>i[1]).length;
  return {items,done,pct:Math.round(done/items.length*100),label:DOC.status||(done===items.length?'Lengkap':'Dalam proses')};
}

function pAnalisis(){

  const av=sc.map(r=>r.avg), mean=av.reduce((a,b)=>a+b,0)/av.length, sd=Math.sqrt(av.reduce((a,b)=>a+(b-mean)**2,0)/av.length);

    <line x1="0" x2="${W}" y1="${H-mean/100*H+10}" y2="${H-mean/100*H+10}" stroke="#ffcf4a" stroke-dasharray="5 4"/>
    ${sc.map((r,i)=>`<g><rect x="${i*bw+bw*.18}" y="${H-r.avg/100*H+10}" width="${bw*.64}" height="${r.avg/100*H}" rx="3" fill="url(#gb)"><title>${esc(r.kod)} · ${esc(r.produk)}: ${f1(r.avg)}</title></rect><text transform="translate(${i*bw+bw/2+3},${H+18}) rotate(-55)" fill="#a9a6d6" font-size="9.5" text-anchor="end">${esc((r.kod||'').replace(/\s/g,''))}</text></g>`).join('')}</svg>`;

  </div>
  <div class="card"><h3 class="ct">CARTA MARKAH PURATA (GARIS KUNING = PURATA)</h3><div class="chart-wrap">${svg}</div></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3 class="ct">PRESTASI MENGIKUT KRITERIA (% DARIPADA MAKSIMUM)</h3>${bars(cp.map(([l,v])=>[l,v,f1(v)+'%']),100)}</div>
    <div class="card"><h3 class="ct">ANALISIS KEKUATAN PROJEK</h3><p style="margin:0 0 8px">Kekuatan utama keseluruhan ialah <b>${esc(strong[0][0])}</b> (${f1(strong[0][1])}%), diikuti <b>${esc(strong[1][0])}</b> (${f1(strong[1][1])}%).</p><p style="margin:0">Ruang penambahbaikan terbesar ialah <b>${esc(strong[5][0])}</b> (${f1(strong[5][1])}%). Peratus dikira daripada purata markah semua projek yang dinilai.</p>

  <div class="grid g3" style="margin-top:16px">${['Emas','Perak','Gangsa'].map(m=>`<div class="card"><h3 class="ct">${medalPill(m)} &nbsp;${ml(m).length} KUMPULAN</h3><div class="mlist">${ml(m).map(r=>`<div><b>#${r.rank}</b><span style="flex:1;min-width:0">${esc(r.kod)} · ${esc(r.produk)}</span><span>${f1(r.avg)}</span></div>`).join('')||'<span class="muted">–</span>'}</div></div>`).join('')}</div>
  <p class="muted" style="font-size:12.5px;margin-top:12px">Kuota pingat: ${quota()[0]} Emas · ${quota()[1]} Perak · ${quota()[2]} Gangsa. Senarai penerima Excel/PDF telah disediakan berasingan.</p>`;
}

/* ---------- print report ---------- */
function buildReport(){
  const p={...DEF_PROFIL,...(DOC.profil||{})}, sc=ROWS.filter(r=>r.n>0).sort(byScore), sp=special(), L=kronList();
  const tb=(h,rows)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  $('report').innerHTML=`<div class="pgb"><div class="rcover"><img src="logo-fib.jpg" alt=""><h1>FUTURE INNOVATORS BOOTCAMP 2026</h1><div style="letter-spacing:.3em;color:#7fdcff">DIGITAL MASTER DOCUMENTATION</div><div style="margin-top:10mm;letter-spacing:.14em;font-weight:700">SM SAINS PASIR PUTEH</div><div style="letter-spacing:.3em;color:#ff6fc1">KELAB INOVASI</div><div style="margin-top:8mm">${esc(p.tarikh)} · ${esc(p.lokasi)}</div></div></div>
  <div class="pgb"><h2>1. Profil Program</h2>${[['Nama program',p.nama],['Penganjur',p.penganjur],['Bidang inovasi',p.bidang],['Tema',p.tema],['Sasaran peserta',p.sasaran]].map(([l,v])=>`<p><b>${l}:</b> ${esc(v)}</p>`).join('')}
  ${[['Pengenalan','pengenalan'],['Latar belakang','latar'],['Rasional','rasional'],['Matlamat','matlamat'],['Objektif','objektif'],['Impak yang diharapkan','impak']].filter(([,k])=>String(p[k]||'').trim()).map(([l,k])=>`<h3>${l}</h3><p style="white-space:pre-line">${esc(p[k])}</p>`).join('')}
  <h3>Jawatankuasa Pelaksana</h3>${tb(['Jawatan','Nama'],String(p.ajk).split('\n').filter(Boolean).map(l=>l.split('|').map(x=>esc(x.trim()))))}</div>
  <div class="pgb"><h2>2. Kronologi Program</h2>${tb(['Tarikh','Masa','Aktiviti','Kategori'],L.slice().sort((a,b)=>(a.tarikh||'9').localeCompare(b.tarikh||'9')||a.i-b.i).map(x=>[x.tarikh?esc(tglMs(x.tarikh)):'—',esc(x.masa||'—'),esc(x.tajuk)+(x.ket?'<br><small>'+esc(x.ket)+'</small>':''),esc(x.kat||'')]))}</div>
  <div class="pgb"><h2>3. Kumpulan Inovasi (${ROWS.length})</h2>${tb(['Kod','Projek','Subjek','Guru','Ahli'],ROWS.slice().sort((a,b)=>kn(a)-kn(b)).map(r=>[esc(r.kod),esc(r.produk),esc(r.subjek),esc(r.guru),r.ahli.map(a=>esc(a.nama)).join(', ')]))}</div>
  <div class="pgb"><h2>4. Penilaian Juri</h2>${tb(['Kriteria','Maks'],KRITERIA.map(k=>[esc(k.n),k.m]))}<br>${tb(['Kod','Projek',...KRITERIA.map((k,i)=>'K'+(i+1)),'Purata','Status'],ROWS.slice().sort((a,b)=>kn(a)-kn(b)).map(r=>[esc(r.kod),esc(r.produk),...r.crit.map(f1),'<b>'+f1(r.avg)+'</b>',r.n===2?'Selesai':r.n===1?'Sedang':'Belum']))}</div>
  <div class="pgb"><h2>5. Keputusan & Ranking</h2><p>Keputusan ${DOC.sahkan&&DOC.sahkan.masa?'disahkan pada '+esc(new Date(DOC.sahkan.masa).toLocaleString('ms-MY')):'belum disahkan'}. Pemecah seri: purata, Impak inovasi, Pembentangan.</p>${tb(['#','Kod','Projek','Juri 1','Juri 2','Purata','Pingat'],sc.map(r=>[r.rank,esc(r.kod),esc(r.produk),r.j1?f1(r.j1.jumlah):'–',r.j2?f1(r.j2.jumlah):'–','<b>'+f1(r.avg)+'</b>',r.medal]))}</div>
  <div><h2>6. Anugerah Khas</h2>${tb(['Anugerah','Penerima','Asas pemilihan'],[...sp.map(a=>[esc(a.t),a.r?esc(a.r.kod+' · '+a.r.produk):a.name?esc(a.name):'<i>'+esc(a.pend)+'</i>',esc(a.b)+(a.r?' ('+a.v(a.r)+')':'')]),...(DOC.anugerah||[]).map(a=>[esc(a.nama),esc(a.penerima||'—'),esc(a.catatan||'')])])}
  <p style="margin-top:12mm;text-align:center;color:#888">Powered by SMSPP YIC 2026 · Dijana ${esc(new Date().toLocaleString('ms-MY'))}</p></div>`;
}

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-g]'); if(g){groupDetail(+g.dataset.g);return}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, i=+a.dataset.i;
  if(act==='print'){buildReport();setTimeout(()=>print(),300);return}
  if(!ADMIN) return;
  if(act==='profil'){const p={...DEF_PROFIL,...(DOC.profil||{})};form('Sunting profil program',[['nama','Nama program'],['tarikh','Tarikh'],['lokasi','Lokasi'],['penganjur','Penganjur'],['bidang','Bidang inovasi'],['tema','Tema program'],['sasaran','Sasaran peserta'],['pengenalan','Pengenalan','t'],['latar','Latar belakang','t'],['rasional','Rasional pelaksanaan','t'],['matlamat','Matlamat','t'],['objektif','Objektif','t'],['impak','Impak yang diharapkan','t'],['ajk','Jawatankuasa (satu baris: Jawatan | Nama)','t']],p,o=>save('profil',o))}
  if(act==='cover'){form('Gambar utama cover',[['gambar','Pautan gambar Google Drive'],['kapsyen','Kapsyen']],DOC.cover||{},o=>save('cover',o))}
  if(act==='kron'){const L=(DOC.kronologi||DEF_KRON).slice();const x=i>=0?L[i]:{kat:KAT_KRON[0]};
    form(i>=0?'Sunting aktiviti':'Tambah aktiviti',[['tarikh','Tarikh (biarkan kosong jika belum disahkan)','d'],['masa','Masa'],['tajuk','Aktiviti'],['ket','Keterangan','t'],['kat','Kategori','s',KAT_KRON]],x,o=>{if(!o.tajuk)throw new Error('Isi nama aktiviti');if(i>=0)L[i]=o;else L.push(o);return save('kronologi',L)},i>=0?`<button class="btn g" type="button" id="del">🗑 Padam</button>`:'');
    if(i>=0)$('del').onclick=async()=>{if($('del').dataset.c){L.splice(i,1);await save('kronologi',L);closeM()}else{$('del').dataset.c=1;$('del').textContent='Tekan lagi untuk padam'}}}
  if(act==='kedit'){const no=+a.dataset.no;closeM();form('Butiran kumpulan '+(ROWS.find(r=>r.no===no)||{}).kod,KFIELDS,DOC['k'+no]||{},o=>save('k'+no,o))}
  if(act==='aw'){const L=(DOC.anugerah||[]).slice();const x=i>=0?L[i]:{};
    form(i>=0?'Sunting anugerah':'Tambah kategori anugerah',[['jenis','Jenis (cth. Anugerah Utama)'],['nama','Nama anugerah'],['penerima','Penerima (kod/kumpulan/individu)'],['catatan','Catatan']],x,o=>{if(!o.nama)throw new Error('Isi nama anugerah');if(i>=0)L[i]=o;else L.push(o);return save('anugerah',L)},i>=0?`<button class="btn g" type="button" id="del">🗑 Padam</button>`:'');
    if(i>=0)$('del').onclick=async()=>{if($('del').dataset.c){L.splice(i,1);await save('anugerah',L);closeM()}else{$('del').dataset.c=1;$('del').textContent='Tekan lagi untuk padam'}}}
  if(act==='foto'){const L=(DOC.gambar||[]).slice();const x=i>=0?L[i]:{};
    form(i>=0?'Sunting gambar':'Tambah gambar',[['url','Pautan gambar Google Drive'],['cap','Kapsyen']],x,o=>{if(!/^https:\/\//.test(o.url))throw new Error('Pautan tidak sah');if(i>=0)L[i]=o;else L.push(o);return save('gambar',L)},i>=0?`<button class="btn g" type="button" id="del">🗑 Padam</button>`:'');
    if(i>=0)$('del').onclick=async()=>{if($('del').dataset.c){L.splice(i,1);await save('gambar',L.length?L:null);closeM()}else{$('del').dataset.c=1;$('del').textContent='Tekan lagi untuk padam'}}}
  if(act==='status'){form('Label status dokumentasi',[['status','Status','s',['Dalam proses','Menunggu pengesahan','Lengkap']]],{status:DOC.status||'Dalam proses'},o=>save('status',o.status))}
  if(act==='sahkan'){const on=!(DOC.sahkan&&DOC.sahkan.masa);if(a.dataset.c){a.disabled=true;try{await save('sahkan',on?{masa:new Date().toISOString()}:null)}catch(err){toast('Gagal: '+err.message,1)}}else{a.dataset.c=1;a.textContent=on?'Tekan lagi untuk sahkan':'Tekan lagi untuk batal'}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){FIL.q=e.target.value;const p=e.target.selectionStart;render();const f=$('fq');f.focus();f.setSelectionRange(p,p)}
});
document.addEventListener('change',e=>{if(e.target.id==='fs'){FIL.s=e.target.value;render()}if(e.target.id==='fm2'){FIL.m=e.target.value;render()}});

$('admBtn').onclick=()=>{
  if(ADMIN){ADMIN='';ss('fibAdm',null);PJ=null;load().then(render);toast('Keluar mod pentadbir');return}
  modal(`<h2 class="st" style="font-size:20px">Mod Pentadbir</h2><p class="muted">Masukkan kod urus setia untuk menyunting dokumentasi dan melihat markah individu juri.</p><form class="f" id="lg"><label for="lk">Kod pentadbir</label><input id="lk" type="password" autocomplete="off"><div style="margin-top:14px"><button class="btn" type="submit">Masuk</button></div><div id="lm" class="muted" style="margin-top:8px"></div></form>`);
  $('lk').focus();
  $('lg').onsubmit=async e=>{e.preventDefault();const k=$('lk').value.trim().toUpperCase();$('lm').textContent='Menyemak…';ADMIN=k;try{await load();if(!ADMIN){$('lm').textContent='Kod salah.';return}ss('fibAdm',k);closeM();render();toast('Mod pentadbir aktif')}catch(_){ADMIN='';$('lm').textContent='Tiada sambungan.'}};
};
function route(){const h=location.hash.slice(1);PAGE=['utama','cover','profil','kronologi','kumpulan','penilaian','analisis','anugerah','laporan'].includes(h)?h:'utama';if(D){render();scrollTo(0,0)}}
addEventListener('hashchange',route);
route();
load().then(render).catch(()=>{$('main').innerHTML='<div class="load">Gagal memuatkan data. <button class="btn g" onclick="location.reload()">Cuba lagi</button></div>'});
</script>
