<html lang="ms">
<head>

<style>
:root{
  --pink:#e6007e;--pink-2:#ff2e93;--pink-d:#9b0057;--wine:#5c0033;--gold:#f6c86a;--gold-2:#ffe3a3;
  --cream:#fff6fb;--ink:#2a0618;--muted:#ffd2ea;

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#7a0044 0%,#3a0020 55%,#1d0010 100%);color:var(--cream);font-family:var(--f-body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right))}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ===== Pembuka ===== */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:radial-gradient(100% 80% at 50% 30%,#c4006b 0%,#5c0033 70%,#2a0018 100%);text-align:center}
#intro .box{display:grid;gap:18px;justify-items:center;max-width:520px}
#intro img.lg{width:min(300px,70vw);height:auto;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#intro h1{margin:0;font-family:var(--f-head);font-size:clamp(20px,5vw,28px);letter-spacing:.12em;color:var(--gold)}
#intro p{margin:0;color:var(--muted);font-size:15px}
.open{border:0;border-radius:99px;padding:16px 34px;font-weight:700;font-size:17px;color:var(--ink);background:linear-gradient(180deg,var(--gold-2),var(--gold));box-shadow:0 10px 30px rgba(246,200,106,.35);display:inline-flex;gap:10px;align-items:center}
.open:focus-visible,.ctl:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sparkle{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.sparkle i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold-2);opacity:0;animation:tw 4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}

/* ===== Pentas buku ===== */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:58px 12px 76px;z-index:2}
.book{container-type:inline-size;position:relative;width:min(92vw,calc((100vh - 150px) * .707),560px);aspect-ratio:1/1.414;perspective:2200px}
.page{position:absolute;inset:0;border-radius:6px 14px 14px 6px;overflow:hidden;transform-origin:left center;transition:transform .9s cubic-bezier(.5,.1,.25,1),opacity .9s;backface-visibility:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55),inset 6px 0 14px rgba(0,0,0,.25)}
.page.past{transform:rotateY(-105deg);opacity:0;pointer-events:none}
.page.future{transform:rotateY(0);opacity:0;pointer-events:none}
.page.now{transform:rotateY(0);opacity:1;z-index:5}
.page .scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* Latar setiap halaman: pink dengan bingkai emas */
.pg{min-height:100%;position:relative;padding:9% 8% 10%;display:flex;flex-direction:column;gap:14px;
  background:
   radial-gradient(70% 40% at 50% 0%,rgba(255,255,255,.18),transparent 70%),
   repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px),
   linear-gradient(170deg,#ff2e93 0%,#e6007e 38%,#b0005f 78%,#7a0040 100%)}
.pg::before{content:"";position:absolute;inset:12px;border:1.5px solid rgba(246,200,106,.75);border-radius:10px;pointer-events:none}
.pg::after{content:"";position:absolute;inset:18px;border:1px solid rgba(246,200,106,.35);border-radius:8px;pointer-events:none}
.ttl{align-self:center;font-family:var(--f-script);font-size:clamp(34px,8.5vw,52px);line-height:1.05;color:var(--wine);text-align:center;padding:6px 26px 8px;border-radius:999px;
  background:linear-gradient(180deg,#fff3c9,#f6c86a 55%,#d9a23e);box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.7)}
.panel{background:rgba(70,0,38,.42);border:1px solid rgba(255,214,235,.18);border-radius:16px;padding:16px 18px;backdrop-filter:blur(2px)}
.panel p{margin:0;line-height:1.7;font-size:clamp(13px,3.2vw,15.5px);text-align:justify;color:#fff}
.pnum{display:none;text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(255,236,246,.75)}

/* Kulit */
.cover{justify-content:flex-start;align-items:center;text-align:center;gap:1.4cqw;padding-top:9%}
.logos{display:flex;gap:14px;align-items:center;justify-content:center}
.logos img{height:12cqw;width:auto;border-radius:50%;background:#fff}
.logos img.fib{border-radius:12px;background:transparent;height:15cqw}
.cv-k{font-family:var(--f-head);font-weight:700;letter-spacing:.08em;font-size:5.6cqw;color:var(--gold);margin-top:4px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.cv-t{font-family:var(--f-script);font-size:12.5cqw;line-height:.95;color:#fff7e0;text-shadow:0 0 18px rgba(255,214,140,.55),0 3px 0 rgba(120,0,60,.35)}
.cv-n{font-family:var(--f-head);font-weight:700;font-size:10cqw;color:var(--gold);line-height:1;text-shadow:0 3px 12px rgba(0,0,0,.3)}
.cv-q{font-family:Georgia,serif;font-style:italic;color:#fff;font-size:3.2cqw}
.cv-info{margin-top:1cqw;width:100%;display:grid;gap:1cqw;text-align:left;padding:2.4cqw 3.4cqw;border-radius:14px;background:rgba(70,0,38,.45);border-top:1.5px solid rgba(246,200,106,.6);border-bottom:1.5px solid rgba(246,200,106,.6)}
.cv-info div{font-size:3cqw;letter-spacing:.04em}
.cv-info b{font-family:var(--f-head);color:var(--gold);letter-spacing:.06em;margin-right:6px}
.cv-by{margin-top:auto;display:grid;gap:2px}
.cv-by small{font-family:var(--f-head);color:var(--gold-2);letter-spacing:.1em;font-size:2.5cqw}
.cv-by strong{font-family:var(--f-head);font-size:3.5cqw;letter-spacing:.05em}
.cv-by span{font-size:2.5cqw;letter-spacing:.08em;opacity:.9}

/* Senarai */
ol.obj{margin:0;padding-left:20px;display:grid;gap:10px}
ol.obj li{line-height:1.6;font-size:clamp(13px,3.2vw,15px)}
.tent{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.tent li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:clamp(12.5px,3.1vw,14.5px);line-height:1.45}
.tent li::before{content:"";width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(246,200,106,.25);justify-self:center}
.tent li.hl{color:var(--gold-2);font-weight:600}

/* Jawatankuasa */
.jk{display:grid;gap:12px;text-align:center}
.jk h4,.jk2 h4{margin:0;font-family:var(--f-head);color:var(--gold);font-size:clamp(11.5px,2.9vw,13.5px);letter-spacing:.08em}
.jk p,.jk2 p{margin:2px 0 0;font-size:clamp(12px,3vw,14px);text-align:center;line-height:1.45}
.jk p em,.jk2 p em{font-style:normal;font-weight:600;color:var(--gold-2)}
.jk2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;text-align:left}
.jk2 h4{text-align:left}.jk2 p{text-align:left}

/* Penjurian */
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.md{border-radius:12px;padding:10px 6px;text-align:center;color:var(--ink);font-weight:700;font-size:12px;letter-spacing:.06em}
.md b{display:block;font-family:var(--f-head);font-size:clamp(22px,6vw,30px);line-height:1.1}
.aw{display:grid;gap:7px}
.aw div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;border-bottom:1px dashed rgba(255,214,235,.3);padding-bottom:6px;font-size:clamp(12px,3vw,14px)}
.aw div span:last-child{color:var(--gold-2);font-size:11.5px;text-align:right}
.crit{display:grid;gap:5px}
.crit div{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:clamp(12px,3vw,14px)}
.crit div b{color:var(--gold-2)}

/* Kumpulan */
.sub-h{text-align:center;display:grid;gap:2px}
.sub-h b{font-family:var(--f-head);color:var(--gold);letter-spacing:.12em;font-size:clamp(13px,3.3vw,16px)}
.sub-h span{font-size:12px;color:var(--muted)}
.grp{background:rgba(70,0,38,.5);border:1px solid rgba(255,214,235,.18);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.grp .gh{display:flex;gap:10px;align-items:center}
.kod{flex:none;font-family:var(--f-head);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--ink);background:linear-gradient(180deg,var(--gold-2),var(--gold));border-radius:8px;padding:4px 9px}
.prod{font-weight:700;font-size:clamp(13.5px,3.4vw,16px);line-height:1.25;min-width:0;overflow-wrap:anywhere}
.guru{font-size:11.5px;color:var(--muted)}
.ahli{margin:0;padding-left:18px;display:grid;gap:1px;font-size:clamp(11.5px,2.9vw,13px);line-height:1.45}
.ahli small{color:var(--muted);font-size:10.5px;margin-left:4px}
.load{text-align:center;color:var(--muted);font-size:14px;padding:24px}

/* Penutup */
.back{justify-content:center;align-items:center;text-align:center;gap:16px}
.back img{width:min(260px,62%);height:auto;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.back .s1{font-family:var(--f-script);font-size:clamp(40px,10vw,62px);color:#fff7e0;line-height:1;text-shadow:0 0 18px rgba(255,214,140,.5)}
.back .s2{font-family:var(--f-head);color:var(--gold);letter-spacing:.1em;font-size:clamp(13px,3.3vw,16px)}
.back .s3{font-size:13px;color:var(--muted);max-width:34ch;line-height:1.6}

/* Kawalan */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.topbar .t{font-family:var(--f-head);font-size:12px;letter-spacing:.14em;color:var(--gold-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{border:1px solid rgba(255,214,235,.35);background:rgba(60,0,32,.55);color:#fff;border-radius:99px;min-height:44px;min-width:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.ctl svg{width:20px;height:20px}
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;align-items:center;gap:14px;
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.pc{min-width:76px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl[disabled]{opacity:.35;cursor:default}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--gold);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.paused .eq i{animation:none;height:4px}
@media (prefers-reduced-motion:reduce){.page{transition:opacity .3s}.page.past{transform:none}.sparkle{display:none}}
</style>
</head>

/* ---------- Halaman kumpulan (data langsung) ---------- */
const SUBJ=[['PAI','Pendidikan Islam'],['MT','Matematik'],['BM','Bahasa Melayu'],['GEO','Geografi'],['SEJ','Sejarah'],['IL','Bahasa Antarabangsa'],['PJPK','Pendidikan Jasmani dan Kesihatan'],['MUZIK','Pendidikan Muzik']];
const kn=k=>{const n=parseInt(String(k||'').replace(/\D/g,''),10);return isNaN(n)?999:n;};
const titleCase=s=>String(s||'').toLowerCase().replace(/(^|[\s.(@\/-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function groupPages(groups){
  const by={};groups.forEach(g=>{const p=String(g.kod||'').split(' ')[0]||'LAIN';(by[p]=by[p]||[]).push(g);});
  const pages=[];let n=0;
  const sec=SUBJ.filter(([p])=>by[p]).concat(Object.keys(by).filter(p=>!SUBJ.find(s=>s[0]===p)).map(p=>[p,p]));
  // satu halaman = maksimum 3 kumpulan supaya mudah dibaca di telefon
  const chunks=[];
  sec.forEach(([p,name])=>{const L=by[p].sort((a,b)=>kn(a.kod)-kn(b.kod));for(let i=0;i<L.length;i+=3)chunks.push({p,name,L:L.slice(i,i+3),part:Math.floor(i/3)+1,parts:Math.ceil(L.length/3),total:L.length});});
  chunks.forEach(c=>{
    pages.push(`<div class="pg">
      ${c.part===1?'<div class="ttl" style="font-size:clamp(28px,7vw,42px)">Peserta Pertandingan</div>':''}
      <div class="sub-h"><b>${esc(c.name.toUpperCase())}</b><span>${c.total} kumpulan${c.parts>1?' · bahagian '+c.part+' / '+c.parts:''}</span></div>
      ${c.L.map(g=>`<div class="grp"><div class="gh"><span class="kod">${esc(g.kod)}</span><span class="prod">${esc(g.produk||'Produk inovasi')}</span></div>
        <div class="guru">Guru pembimbing: ${esc(titleCase(g.guru||'-'))}</div>
        <ol class="ahli">${(g.ahli||[]).map(a=>`<li>${esc(a.nama)}<small>${esc(a.kelas||'')}</small></li>`).join('')}</ol></div>`).join('')}
    </div>`);
  });
  return pages;
}

/* ---------- Buku ---------- */
let pages=[],cur=0;
function build(groupHTML){
  pages=P.concat(groupHTML,[BACK]);
  $('book').innerHTML=pages.map((h,i)=>`<article class="page ${i===cur?'now':i<cur?'past':'future'}" aria-hidden="${i!==cur}" aria-label="Halaman ${i+1}"><div class="scroll">${h.replace('</div>',`</div>`)}<div class="pnum" aria-hidden="true">${i+1}</div></div></article>`).join('');
  show(cur);
}
function show(i){
  cur=Math.max(0,Math.min(pages.length-1,i));
  [...$('book').children].forEach((el,k)=>{el.className='page '+(k===cur?'now':k<cur?'past':'future');el.setAttribute('aria-hidden',k!==cur);if(k===cur)el.querySelector('.scroll').scrollTop=0;});
  $('pc').textContent=(cur+1)+' / '+pages.length;
  $('prev').disabled=cur===0;$('next').disabled=cur===pages.length-1;
  try{sessionStorage.setItem('fib_ebook_pg',cur);}catch(_){}
}
$('prev').addEventListener('click',()=>show(cur-1));
$('next').addEventListener('click',()=>show(cur+1));
document.addEventListener('keydown',e=>{if($('intro').hidden){if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);}});
let sx=null,sy=null;
$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)show(cur+(dx<0?1:-1));sx=null;},{passive:true});

build(['<div class="pg"><div class="ttl" style="font-size:clamp(28px,7vw,42px)">Peserta Pertandingan</div><div class="load">Memuatkan senarai kumpulan…</div></div>']);
fetch(GAS_URL+'?action=awam',{cache:'no-store'}).then(r=>r.json()).then(r=>{
  if(!r.ok) throw 0;
  const g=r.groups.filter(x=>x.kod&&!/batal/i.test(x.kod)&&(x.ahli||[]).length);
  build(groupPages(g));
}).catch(()=>build(['<div class="pg"><div class="ttl" style="font-size:clamp(28px,7vw,42px)">Peserta Pertandingan</div><div class="load">Senarai kumpulan tidak dapat dimuatkan. Semak sambungan internet dan muat semula halaman.</div></div>']));

/* ---------- Muzik latar (muzik-fib.mp3, berulang) ---------- */
const BG=new Audio('muzik-fib.mp3');BG.loop=true;BG.preload='auto';BG.volume=0;
let playing=false,fadeT=null;
function fadeTo(v,ms){clearInterval(fadeT);const st=BG.volume,t0=performance.now();fadeT=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);BG.volume=Math.max(0,Math.min(1,st+(v-st)*k));if(k>=1){clearInterval(fadeT);if(v===0)BG.pause();}},50);}
function setUI(on){document.body.classList.toggle('paused',!on);$('btnMusic').setAttribute('aria-pressed',on?'true':'false');$('musicLbl').textContent=on?'Muzik':'Senyap';}
function startMusic(){playing=true;setUI(true);const p=BG.play();if(p&&p.catch)p.catch(()=>{playing=false;setUI(false);});fadeTo(.85,2500);}
function stopMusic(){playing=false;setUI(false);fadeTo(0,800);}
$('btnMusic').addEventListener('click',()=>playing?stopMusic():startMusic());
$('btnOpen').addEventListener('click',()=>{$('intro').hidden=true;startMusic();$('next').focus();});
document.addEventListener('visibilitychange',()=>{if(!playing)return;if(document.hidden)BG.pause();else BG.play().catch(()=>{});});
</script>
